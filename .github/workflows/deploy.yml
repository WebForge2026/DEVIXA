run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://devixa.de
      - name: Assemble release tarball
        run: |
          staging_dir=$(mktemp -d "$RUNNER_TEMP/devixa-release.XXXXXXXXXX")
          trap 'rm -rf -- "$staging_dir"' EXIT
          mkdir "$staging_dir/deploy"
          cp -r dist "$staging_dir/site"
          cp -r php/api "$staging_dir/api"
          cp -r php/lib "$staging_dir/lib"
          cp -r database "$staging_dir/database"
          cp php/deploy/.htaccess php/deploy/locale.php "$staging_dir/deploy/"
          cp scripts/deploy.sh "$staging_dir/deploy.sh"
          tar -czf "$RUNNER_TEMP/release.tar.gz" -C "$staging_dir" .
      - name: Upload release artifact
        uses: actions/upload-artifact@v6
        with:
          name: release
          path: ${{ runner.temp }}/release.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Hetzner Webhosting L
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v7
        with:
          name: release

      - name: Install SSH configuration
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          : "${HETZNER_SSH_KEY:?Set the HETZNER_SSH_KEY secret}"
          : "${HETZNER_KNOWN_HOSTS:?Set the HETZNER_KNOWN_HOSTS secret}"
          install -m 700 -d "$HOME/.ssh"
          umask 077
          printf '%s\n' "$HETZNER_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Upload and activate release
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_PORT: ${{ secrets.HETZNER_SSH_PORT || '222' }}
        run: |
          : "${HETZNER_HOST:?Set the HETZNER_HOST secret}"
          : "${HETZNER_USER:?Set the HETZNER_USER secret}"

          remote_deploy=$(cat <<'REMOTE'
          set -eu
          staging_dir=$(mktemp -d "$HOME/.devixa-deploy.XXXXXXXXXX")
          trap 'rm -rf -- "$staging_dir"' EXIT
          tar -xzf - -C "$staging_dir"
          cd "$staging_dir"
          APP_ROOT="$HOME/public_html/devixa.de" bash ./deploy.sh </dev/null
          REMOTE
          )

          ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -i "$HOME/.ssh/deploy_key" \
            -p "$HETZNER_SSH_PORT" -l "$HETZNER_USER" -- "$HETZNER_HOST" \
            "$remote_deploy" < release.tar.gz

      - name: Health check
        run: |
          status=$(curl -fsS --max-time 20 --retry 5 --retry-delay 2 --retry-all-errors \
            --output /dev/null --write-out '%{http_code}' https://devixa.de/api/health)
          if [[ "$status" != 200 ]]; then
            printf 'Expected HTTP 200 from /api/health, received %s\n' "$status" >&2
            exit 1
          fi
